# Throwaway Active Directory attack range (isolated bridge network).
#   dc01      172.28.0.10  — Samba AD DC for lab.local (roastable accounts seeded)
#   attacker  172.28.0.x   — Kali with impacket/netexec/bloodhound/john
#
# Not exposed to the host: the DC ports live only on the adlab network.
services:
  dc:
    build:
      context: .
      dockerfile: Dockerfile.dc
    container_name: ad-dc
    hostname: dc01
    privileged: true          # Samba AD DC wants broad caps; fine for a lab
    networks:
      adlab:
        ipv4_address: 172.28.0.10

  attacker:
    build:
      context: .
      dockerfile: Dockerfile.attacker
    container_name: ad-attacker
    cap_add:
      - NET_ADMIN
    dns:
      - 172.28.0.10            # resolve lab.local via the DC
    tty: true
    stdin_open: true
    command: sleep infinity
    depends_on:
      - dc
    networks:
      - adlab

networks:
  adlab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
